[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-toolkit-mcp"
version = "0.1.0"
description = "Local batch image processing MCP server (resize/convert/compress/watermark/strip EXIF), 100% offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "diyaluo" }]
dependencies = [
  "mcp>=1.0",
  "Pillow>=9.0",
]

[project.scripts]
image_toolkit_mcp = "image_toolkit_mcp.server:main"

[project.urls]
Homepage = "https://github.com/diyaluo/image-toolkit-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/image_toolkit_mcp"]
